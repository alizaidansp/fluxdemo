apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: demoapp
  name: demodep
  namespace: demoapp-9-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      containers:
      - image: yogeshraheja/fluxdemo:1.0.0 # {"$imagepolicy": "flux-system:demoapp-9-image-policy"}
        name: demoapp